<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient matching dark theme -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1322" />
      <stop offset="100%" stop-color="#060912" />
    </linearGradient>

    <!-- Subtle Container Border Sheen -->
    <linearGradient id="containerBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.65" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#D946EF" stop-opacity="0.55" />
    </linearGradient>

    <!-- Saturated Neon Gradient (Electric Cyan -> Blue -> Neon Purple -> Vibrant Orchid) -->
    <linearGradient id="neonYGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="26%" stop-color="#4F46E5" />
      <stop offset="58%" stop-color="#8B5CF6" />
      <stop offset="82%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#D946EF" />
    </linearGradient>

    <!-- Ambient Backlight Blur -->
    <filter id="ambientDiffuse" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="38" result="blur" />
    </filter>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blurGlow" />
      <feMerge>
        <feMergeNode in="blurGlow" />
        <feMergeNode in="blurGlow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Inner Core Filament Glow -->
    <filter id="coreGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="fGlow" />
      <feMerge>
        <feMergeNode in="fGlow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Rounded Squircle Base -->
  <rect x="22" y="22" width="468" height="468" rx="114" fill="url(#bgGrad)" stroke="url(#containerBorder)" stroke-width="3" />

  <!-- Ambient Neon Radial Backlight Illumination -->
  <circle cx="190" cy="190" r="140" fill="#4F46E5" opacity="0.42" filter="url(#ambientDiffuse)" />
  <circle cx="320" cy="180" r="130" fill="#D946EF" opacity="0.36" filter="url(#ambientDiffuse)" />
  <circle cx="256" cy="340" r="120" fill="#8B5CF6" opacity="0.44" filter="url(#ambientDiffuse)" />

  <!-- Layer 1: Broad Neon Halo (Unified Single Path) -->
  <path d="M 138 128 L 256 258 L 256 398 M 374 128 L 256 258"
        fill="none" stroke="url(#neonYGrad)" stroke-width="96" stroke-linecap="round" stroke-linejoin="round"
        opacity="0.45" filter="url(#ambientDiffuse)" />

  <!-- Layer 2: Main Solid Neon Tube Body (Unified Single Path) -->
  <path d="M 138 128 L 256 258 L 256 398 M 374 128 L 256 258"
        fill="none" stroke="url(#neonYGrad)" stroke-width="78" stroke-linecap="round" stroke-linejoin="round"
        filter="url(#neonGlow)" />

  <!-- Layer 3: Inner Fiber-Optic Neural Circuit Line (Unified Single Path) -->
  <path d="M 138 128 L 256 258 L 256 398 M 374 128 L 256 258"
        fill="none" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"
        opacity="0.95" filter="url(#coreGlow)" />

  <!-- Layer 4: Pulse Nodes along the Neural Circuit -->
  <g filter="url(#coreGlow)">
    <!-- Top-Left Terminal Node -->
    <circle cx="138" cy="128" r="7" fill="#FFFFFF" />
    <circle cx="138" cy="128" r="12" fill="#00E5FF" opacity="0.65" />

    <!-- Central Fusion Junction Node -->
    <circle cx="256" cy="258" r="8.5" fill="#FFFFFF" />
    <circle cx="256" cy="258" r="15" fill="#C084FC" opacity="0.75" />

    <!-- Bottom Stem Terminal Node -->
    <circle cx="256" cy="398" r="7" fill="#FFFFFF" />
    <circle cx="256" cy="398" r="12" fill="#8B5CF6" opacity="0.65" />

    <!-- Top-Right Terminal Node -->
    <circle cx="374" cy="128" r="7" fill="#FFFFFF" />
    <circle cx="374" cy="128" r="12" fill="#D946EF" opacity="0.65" />
  </g>

  <!-- Layer 5: Subtle 3D Glass Surface Sheen Highlight -->
  <path d="M 138 128 L 256 258 L 256 398 M 374 128 L 256 258"
        fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.25" />
</svg>
