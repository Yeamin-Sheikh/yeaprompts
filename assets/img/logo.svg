<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background subtle gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121829" />
      <stop offset="100%" stop-color="#080C16" />
    </linearGradient>

    <!-- Border highlight gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#06B6D4" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.25" />
    </linearGradient>

    <!-- Main 'Y' Left Branch Gradient -->
    <linearGradient id="yLeftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <!-- Main 'Y' Right & Stem Branch Gradient -->
    <linearGradient id="yRightGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="40%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="ambientGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28" result="blur" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="5" />

  <!-- Inner Ambient Neon Backdrop Glow -->
  <circle cx="256" cy="240" r="140" fill="#8B5CF6" opacity="0.22" filter="url(#ambientGlow)" />
  <circle cx="320" cy="180" r="100" fill="#06B6D4" opacity="0.18" filter="url(#ambientGlow)" />

  <!-- 'Y' Monogram Geometry -->
  <g filter="url(#glow)">
    <!-- Right branch down to stem (Continuous curve) -->
    <path d="M 368 142 C 328 214 286 268 256 312 L 256 386" 
          fill="none" 
          stroke="url(#yRightGrad)" 
          stroke-width="44" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Left branch joining the stem at center -->
    <path d="M 144 142 C 184 214 226 268 256 312" 
          fill="none" 
          stroke="url(#yLeftGrad)" 
          stroke-width="44" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Neon Prompt Spark / Continuity Node at junction -->
    <circle cx="256" cy="312" r="12" fill="#FFFFFF" />
    <!-- Secondary prompt nodes on branch tips -->
    <circle cx="144" cy="142" r="9" fill="#E9D5FF" />
    <circle cx="368" cy="142" r="9" fill="#BAE6FD" />
    <circle cx="256" cy="386" r="10" fill="#C084FC" />
  </g>
</svg>
